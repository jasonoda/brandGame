<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bonus Spin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=DM+Sans:wght@400;500;600;700&family=Nunito:wght@600;700&family=Sanchez&family=Aleo:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="startMenu">
        <div id="startMenuContainer">
            <div style="font-size: 40px; margin-bottom: 10px;">🎡</div>
            <div id="memoryTitle">BONUS SPIN</div>
            <div id="instructionsStartDiv">
                <div class="instructionLine">Spin the wheel for bonus rewards</div>
                <div class="instructionDivider"></div>
                <div class="instructionLine">Complete daily games to unlock your bonus spin</div>
                <div class="instructionDivider"></div>
                <div class="instructionLine">Earn extra stars and rewards</div>
            </div>
            <div id="playButton">PLAY</div>
        </div>
    </div>

    <div class="container" style="display: none;">
        <div id="underConstruction">
            <h1>Under Construction</h1>
            <p>This game is coming soon!</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
