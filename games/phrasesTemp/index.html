<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phrases</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=DM+Sans:wght@400;500;600;700&family=Nunito:wght@600;700&family=Sanchez&family=Aleo:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="startMenu">
        <div id="startMenuContainer">
            <img src="../../src/img/phrases.svg" alt="Phrases" style="height: 40px; width: auto; margin-bottom: 10px;">
            <div id="memoryTitle">PHRASES</div>
            <div id="instructionsStartDiv">
                <div class="instructionLine">Guess the phrase relating<br>to this week's theme</div>
                <div class="instructionDivider"></div>
                <div class="instructionLine">Select the correct letters from the phrase without getting 3 strikes</div>
                <div class="instructionDivider"></div>
                <div class="instructionLine">Solve the puzzle to earn stars</div>
            </div>
            <div id="playButton">PLAY</div>
        </div>
    </div>

    <div class="container" style="display: none;">
        <div id="underConstruction">
            <h1>Under Construction</h1>
            <p>This game is coming soon!</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
